name: Collectors CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source sizes and nested repositories
        run: |
          python3 - <<'PY'
          import subprocess
          objects = subprocess.check_output(['git', 'rev-list', '--objects', '--all'])
          details = subprocess.check_output(
              ['git', 'cat-file', '--batch-check=%(objecttype) %(objectsize) %(rest)'],
              input=objects,
          ).decode().splitlines()
          for entry in details:
              kind, size, *_ = entry.split(' ', 2)
              assert kind != 'blob' or int(size) <= 10 * 1024 * 1024, entry
          entries = subprocess.check_output(['git', 'ls-tree', '-r', '-z', '-l', 'HEAD']).split(b'\0')
          total = 0
          for entry in filter(None, entries):
              metadata, path = entry.split(b'\t', 1)
              mode, kind, oid, size = metadata.split()
              assert mode != b'160000', 'Nested repositories are outside this library distribution'
              total += int(size)
          assert total <= 100 * 1024 * 1024, f'Source tree is {total} bytes'
          print(f'Source tree: {total} bytes; all reachable blobs <= 10 MiB')
          PY
      - name: Scan complete history and source for secrets
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all --full-history -m"
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner .
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Locked Rust checks and package
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-musl
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo check --locked --target x86_64-unknown-linux-musl
          cargo package --locked --no-verify
      - name: Read-only dependency boundary
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/collectors-metadata.json"
          python3 - "$RUNNER_TEMP/collectors-metadata.json" <<'PY'
          import json, sys, tomllib
          manifest = tomllib.load(open('Cargo.toml', 'rb'))
          assert set(manifest['dependencies']) == {'sysinfo', 'parking_lot', 'serde_json', 'libc', 'sha2'}
          assert not manifest.get('features'), 'Control/update feature switches are forbidden'
          metadata = json.load(open(sys.argv[1]))
          forbidden = {'w-monitor-sdk', 'w-monitor-service', 'w-monitor-lite', 'axum', 'tokio', 'reqwest', 'tokio-tungstenite'}
          assert not forbidden.intersection(p['name'] for p in metadata['packages'])
          assert all('git.aiot.ml' not in (p.get('source') or '') for p in metadata['packages'])
          print('Standalone read-only dependency boundary verified')
          PY
      - name: Checksum checked source package
        id: source-package
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          artifact="w-monitor-collectors-$version.crate"
          (cd target/package && sha256sum "$artifact" > "$artifact.sha256")
          echo "path=target/package/$artifact" >> "$GITHUB_OUTPUT"
      - name: Upload checked source package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w-monitor-collectors-source-${{ github.sha }}
          path: |
            ${{ steps.source-package.outputs.path }}
            ${{ steps.source-package.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'agi-wang/w-monitor-collectors'
    needs: [source-policy, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish immutable source package after checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$RELEASE_TAG" = "v$version"
          git merge-base --is-ancestor HEAD origin/main
          cargo package --locked --no-verify
          artifact="w-monitor-collectors-$version.crate"
          cd target/package
          sha256sum "$artifact" > "$artifact.sha256"
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tags/' + os.environ['RELEASE_TAG']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'w-monitor-collectors-release'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
              assert not release['draft'] and not release['prerelease']
              exists = True
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              exists = False
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RELEASE_EXISTS=' + str(exists).lower() + '\n')
          with open(os.environ['RUNNER_TEMP'] + '/existing-release.json', 'w') as output:
              json.dump(exists, output)
          PY
          if test "$(cat "$RUNNER_TEMP/existing-release.json")" = true; then
            mkdir "$RUNNER_TEMP/release-readback"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-readback"
            test "$(find "$RUNNER_TEMP/release-readback" -type f | wc -l)" -eq 2
            cmp "$artifact" "$RUNNER_TEMP/release-readback/$artifact"
            cmp "$artifact.sha256" "$RUNNER_TEMP/release-readback/$artifact.sha256"
          else
            gh release create "$RELEASE_TAG" "$artifact" "$artifact.sha256" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes 'Shared read-only collectors. Consumers independently validate the immutable source revision before releasing.' --latest
          fi
